name: build-vllm-poc

# Builds and publishes the image the Gonka network runs: the base vLLM image,
# this repository's in-tree residual overlaid on top, and the out-of-tree
# gonka-poc plugin installed over both (docker/Dockerfile.gonka-poc).
#
# This is a Stage-2 image in the foundry chain: mlnode-foundry consumes it as
# stage2.image, which its schema restricts to ghcr.io/kaitakuai/vllm-poc.
#
# The residual is Python-only, so the base image supplies every compiled
# artifact and a build takes minutes rather than hours. The corollary is that
# the base has to ship the same vLLM minor the residual targets: the Dockerfile
# refuses to build otherwise, because .py from one minor over .so from another
# half-works instead of failing.
#
# Tag scheme:
#   <tag>            mutable; points at the branch HEAD
#   <tag>-<sha9>     immutable; points at the specific commit

on:
  push:
    branches:
      - 'poc-residual-glm53'
    paths:
      - 'vllm/**'
      - 'docker/Dockerfile.gonka-poc'
      - '.github/workflows/build-vllm-poc.yml'
  workflow_dispatch:
    inputs:
      base_image:
        description: 'BASE_IMAGE override. Default: vllm/vllm-openai:glm53-flash.'
        required: false
      image_tag:
        description: 'Mutable image tag. Default: glm53-poc-v4.'
        required: false
      expected_vllm_version:
        description: 'Version the base image must report. Default: the pinned GLM-5.3-Flash build.'
        required: false
      gonka_poc_ref:
        description: 'gonka-poc plugin tag. Default: v0.1.4.'
        required: false
      gonka_poc_repo:
        description: 'gonka-poc source repo. Default: kaitakuai/gonka-vllm-plugins.'
        required: false
      smoke_image:
        description: 'Skip the build and only run the CPU checks against this image.'
        required: false
      smoke_stage3:
        description: 'Add the mlnode-layer checks (set when smoke_image is a Stage 3 image).'
        type: boolean
        default: false

permissions:
  packages: write       # GHCR push
  contents: read

concurrency:
  group: build-vllm-poc-${{ github.ref }}
  cancel-in-progress: false   # don't interrupt mid-publish

jobs:
  build:
    if: inputs.smoke_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      immutable_tag: ${{ steps.tag.outputs.immutable_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false

      - name: Derive tags + build args
        id: tag
        env:
          INPUT_BASE_IMAGE: ${{ inputs.base_image }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_EXPECTED_VLLM_VERSION: ${{ inputs.expected_vllm_version }}
          INPUT_GONKA_POC_REF: ${{ inputs.gonka_poc_ref }}
          INPUT_GONKA_POC_REPO: ${{ inputs.gonka_poc_repo }}
        run: |
          set -euo pipefail
          BASE_IMAGE="${INPUT_BASE_IMAGE:-vllm/vllm-openai:glm53-flash}"
          IMAGE_TAG="${INPUT_IMAGE_TAG:-glm53-poc-v4}"
          EXPECTED_VLLM_VERSION="${INPUT_EXPECTED_VLLM_VERSION:-0.1.dev20051+g487ecf187}"
          GONKA_POC_REF="${INPUT_GONKA_POC_REF:-v0.1.4}"
          GONKA_POC_REPO="${INPUT_GONKA_POC_REPO:-kaitakuai/gonka-vllm-plugins}"
          SHA9="${GITHUB_SHA:0:9}"
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vllm-poc"
          {
            echo "base_image=$BASE_IMAGE"
            echo "expected_vllm_version=$EXPECTED_VLLM_VERSION"
            echo "gonka_poc_ref=$GONKA_POC_REF"
            echo "gonka_poc_repo=$GONKA_POC_REPO"
            echo "mutable_tag=${IMAGE_REPO}:${IMAGE_TAG}"
            echo "immutable_tag=${IMAGE_REPO}:${IMAGE_TAG}-${SHA9}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: BASE_IMAGE=$BASE_IMAGE → ${IMAGE_REPO}:${IMAGE_TAG}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gonka-poc
          push: true
          tags: |
            ${{ steps.tag.outputs.mutable_tag }}
            ${{ steps.tag.outputs.immutable_tag }}
          cache-from: type=registry,ref=${{ steps.tag.outputs.mutable_tag }}-buildcache
          cache-to: type=registry,ref=${{ steps.tag.outputs.mutable_tag }}-buildcache,mode=max
          build-args: |
            BASE_IMAGE=${{ steps.tag.outputs.base_image }}
            EXPECTED_VLLM_VERSION=${{ steps.tag.outputs.expected_vllm_version }}
            GONKA_POC_REF=${{ steps.tag.outputs.gonka_poc_ref }}
            GONKA_POC_REPO=${{ steps.tag.outputs.gonka_poc_repo }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=vLLM + kaitakuai residual + gonka-poc (BASE: ${{ steps.tag.outputs.base_image }})
            ai.kaitakuai.gonka_poc.ref=${{ steps.tag.outputs.gonka_poc_ref }}

      - name: Summary
        run: |
          {
            echo "### vllm-poc build summary"
            echo ""
            echo "- **BASE_IMAGE**: \`${{ steps.tag.outputs.base_image }}\`"
            echo "- **Expected vLLM**: \`${{ steps.tag.outputs.expected_vllm_version }}\`"
            echo "- **Plugin**: \`${{ steps.tag.outputs.gonka_poc_repo }}@${{ steps.tag.outputs.gonka_poc_ref }}\`"
            echo "- **Mutable tag**: \`${{ steps.tag.outputs.mutable_tag }}\`"
            echo "- **Immutable tag**: \`${{ steps.tag.outputs.immutable_tag }}\`"
            echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    # CPU-only acceptance: does the image contain what we think it contains.
    # Covers the residual surfaces, the plugin's version dispatch, the entry
    # points the runner launches through, and whether the base can name the
    # model. Proves nothing about numerical output -- that needs a card.
    needs: build
    if: always() && (inputs.smoke_image != '' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target image
        id: target
        env:
          SMOKE_IMAGE: ${{ inputs.smoke_image }}
          BUILT_IMAGE: ${{ needs.build.outputs.immutable_tag }}
        run: |
          set -euo pipefail
          IMAGE="${SMOKE_IMAGE:-$BUILT_IMAGE}"
          [ -n "$IMAGE" ] || { echo "::error::no image to check"; exit 1; }
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Checking $IMAGE"

      - name: Pull image
        run: docker pull "${{ steps.target.outputs.image }}"

      - name: Run checks
        run: |
          set -o pipefail
          FLAGS=""
          if [ "${{ inputs.smoke_stage3 }}" = "true" ]; then FLAGS="--stage3"; fi
          docker run --rm --entrypoint python3 \
            -v "$PWD/tools/smoke_cpu.py:/tmp/smoke_cpu.py:ro" \
            "${{ steps.target.outputs.image }}" /tmp/smoke_cpu.py $FLAGS \
            | tee /tmp/smoke.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### smoke-cpu: \`${{ steps.target.outputs.image }}\`"
            echo ""
            echo '```'
            cat /tmp/smoke.log 2>/dev/null || echo "(no output -- the run failed before the checks)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
